title: "Les examens en consultation"

scene:
  room: rooms/consultation.yaml

  sequences:
    - id: consultation_start
      narration: >
        Lors de votre visite d'inclusion et de vos visites de suivi, vous réaliserez un ensemble de tests en présence d'un infirmier.
      actions:
        - action: show_text
          text:  |-
            Déroulement de la visite

        - action: place_character
          character: patient
          pose: sitting
          chair: patient_chair
          facing: right

        - action: place_character
          character: nurse
          pose: sitting
          chair: neurologist_chair
          facing: left

    - id: speech
      narration: >
        Nous enregistrons votre voix pour analyser certaines caractéristiques de votre parole.
      actions:
        - action: show_text
          text:  |-
            Analyse de la parole

        - action: show_illustration
          id: test
          file: assets/devices/audio-recorder.svg
          x: 1.85
          y: -1.5
          width: 0.4
          z_index: 4

    - id: handwriting
      narration: >
        Des exercices d'écriture nous permettent d'étudier la précision et la fluidité de vos mouvements.
      actions:
        - action: show_text
          text:  |-
            Écriture et motricité fine

        - action: show_illustration
          id: test
          file: assets/devices/graphic-tablet.svg
          x: 0.5
          y: -1.525
          width: 1.2
          facing: left
          z_index: 4

        - action: show_illustration
          id: camera
          file: assets/devices/camera-small-tripod.svg
          x: 1.3
          y: -1.55
          width: 0.6
          facing: left
          z_index: 4

    - id: eye_tracking
      narration: >
        L'oculométrie nous permet d'étudier vos mouvements oculaires lorsque vous regardez un écran.
      actions:
        - action: show_text
          text: |-
            Mouvements des yeux

        - action: hide_illustration
          id: camera

        - action: show_illustration
          id: test
          file: assets/devices/monitor-eye-tracker.svg
          x: 1.2
          y: -1.55
          width: 1.0
          z_index: 4

    - id: walking
      narration: >
        Un examen clinique et un test de marche sont ensuite réalisées dans le laboratoire du mouvement, situé dans une salle voisine.
      actions:
        - action: show_text
          text: |-
            Examen clinique et
            test de marche

        - action: hide_illustration
          id: test

        - action: set_z_index
          character: patient
          z_index: 6

        - action: set_z_index
          character: nurse
          z_index: 5

        - action: parallel
          actions:

          - action: walk_to
            character: patient
            facing: right
            path:
              - location: next_to_left_seat
              - location: waypoint1
              - location: door

          - action: walk_to
            character: nurse
            facing: right
            path:
              - location: next_to_right_seat
              - location: door

    - id: other_video
      narration: >
        Le détail de ces examens vous est présenté dans la vidéo suivante.
        Puis nous recueillons des échantillons biologiques pour rechercher des marqueurs de la maladie.
      actions:
        - action: show_text
          text: |-
            Voir les détails dans
            la vidéo suivante

        - action: parallel
          actions:

          - action: walk_to
            character: patient
            facing: left
            path:
              - location: door
              - location: waypoint1
              - location: next_to_left_seat

          - action: walk_to
            character: nurse
            facing: left
            path:
              - location: door
              - location: next_to_right_seat

        - action: set_z_index
          character: patient
          z_index: 2

        - action: set_z_index
          character: nurse
          z_index: 2

        - action: sit_on
          character: patient
          chair: patient_chair
          pose: sitting
          facing: right

        - action: sit_on
          character: nurse
          chair: neurologist_chair
          pose: sitting
          facing: left

    - id: biological_samples
      narration: >
        Pour cela, nous prélevons de la salive, des larmes, du sang et de l'urine.
      actions:
        - action: show_text
          text: |-
            Prélèvement de salive, de larmes,
            de sang, et d'urine

        - action: show_illustration
          id: test
          file: assets/devices/medical-sampling-case.svg
          x: 2.5
          y: -1.55
          width: 0.65
          z_index: 4

    - id: octa1
      narration: >
        Nous réalisons aussi un examen oculaire non invasif, appelé OCT angiographie.
      actions:
        - action: show_text
          text: |-
            Imagerie de la rétine (OCT-A)

        - action: hide_illustration
          id: test

        - action: set_z_index
          character: patient
          z_index: 0

        - action: set_z_index
          character: nurse
          z_index: 0

        - action: parallel
          actions:

          - action: walk_to
            character: patient
            facing: left
            path:
              - location: behind_left_seat
              - location: next_to_left_stool

          - action: walk_to
            character: nurse
            facing: left
            path:
              - location: behind_right_seat
              - location: waypoint2
              - location: next_to_right_stool

        - action: sit_on
          character: patient
          chair: ophthalmic_stool
          pose: sitting
          facing: right

        - action: sit_on
          character: nurse
          chair: second_ophthalmic_stool
          pose: sitting
          facing: left

    - id: octa2
      narration: >
        Cet examen permet d'observer la structure et les petits vaisseaux de votre rétine.
      actions:
        - action: show_text
          text:  |-
            Imagerie de la rétine (OCT-A)

    - id: questionnaires
      narration: >
        Lors de vos visites de suivi, nous récupérons aussi vos questionnaires, si vous avez choisi la version papier.
      actions:
        - action: show_text
          text:  |-
            Récupération des
            questionnaires

        - action: parallel
          actions:

          - action: walk_to
            character: patient
            facing: right
            path:
              - location: next_to_left_stool
              - location: behind_left_seat

          - action: walk_to
            character: nurse
            facing: right
            path:
              - location: next_to_right_stool
              - location: waypoint2
              - location: behind_right_seat

        - action: set_z_index
          character: patient
          z_index: 2

        - action: set_z_index
          character: nurse
          z_index: 2

        - action: sit_on
          character: patient
          chair: patient_chair
          pose: sitting
          facing: right

        - action: sit_on
          character: nurse
          chair: neurologist_chair
          pose: sitting
          facing: left

    - id: next_appointment
      narration: >
        Enfin, avant de repartir, nous fixons ensemble votre prochain rendez-vous, six mois plus tard.
      actions:
        - action: show_text
          text:  |-
            Prochaine visite dans 6 mois

        - action: stand_up
          character: nurse
          facing: left
          location: next_to_right_seat

        - action: change_pose
          character: nurse
          pose: standing_with_tablet
          facing: left

        - action: stand_up
          character: patient
          facing: right
          location: next_to_left_seat
