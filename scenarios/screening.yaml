title: "Le premier contact"

scene:
  room: rooms/home.yaml

  sequences:
    # 'Parkinesonne' pour une prononciation correcte...
    - id: information
      narration: >
        Vous avez été informé de l'étude EvoluPark ?
        Vous avez reçu un diagnostic de maladie de 'Parkinesonne' et souhaitez participer à cette recherche ?
      actions:
        - action: show_text
          text: |-
            Vous souhaitez participer
            à EvoluPark ?

        - action: show_illustration
          id: laptop
          file: assets/devices/logo-on-laptop.svg
          x: -1.0
          y: -2.5
          width: 5.4
          z_index: 8

        - action: show_illustration
          id: hand
          file: assets/devices/mouse-in-hand.svg
          x: 2.3
          y: -3.4
          width: 1.5
          z_index: 9

    - id: call
      narration: >
        Vous contactez alors l'équipe de recherche par téléphone.
        Un attaché ou une attachée de recherche clinique vous répond.
      actions:
        - action: show_text
          text: |-
            Un premier échange
            téléphonique

        - action: show_illustration
          id: hand
          file: assets/devices/phone-in-hand.svg
          x: 2.3
          y: -2.7
          width: 1.5
          z_index: 9

    - id: appointment
      narration: >
        Cette personne vous pose quelques questions pour vérifier les premiers critères de participation.
        Si ce premier échange est favorable, elle vous propose un rendez-vous d'inclusion au CHU de Brest.
      actions:
        - action: show_text
          text: |-
            Vérification des critères
            et prise de rendez-vous

        - action: hide_illustration
          id: hand

        - action: show_illustration
          id: speech
          x: 3.0
          y: -2.0
          width: 2.0
          z_index: 6
          facing: right
          animation:
            frames:
              - assets/speech/yes.svg
              - assets/speech/no.svg
            period: 5.0
