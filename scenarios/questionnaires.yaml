title: "Les questionnaires à domicile"

scene:
  room: rooms/home.yaml

  sequences:
    - id: quality_of_life
      narration: >
        Tous les trois mois, vous remplissez chez vous un questionnaire sur votre qualité de vie.
        Il nous aide à mieux comprendre comment vous vous sentez et comment votre quotidien évolue.
        Avant chaque visite à l'hôpital, vous le remplissez environ une semaine à l'avance.
      actions:
        - action: show_text
          text: |-
            Votre qualité de vie
            Tous les 3 mois

        - action: show_illustration
          id: laptop
          file: assets/devices/questionnaire-on-laptop.svg
          x: -1.0
          y: -2.5
          width: 5.4
          z_index: 8

        - action: show_illustration
          id: hand
          file: assets/devices/mouse-in-hand.svg
          x: 2.3
          y: -3.4
          width: 1.5
          z_index: 9
          motion:
            type: ping_pong
            dx: 0.20
            dy: 0.0
            period: 4.0
            active_fraction: 0.5

    - id: social_life
      narration: >
        Tous les six mois, vous remplissez également un questionnaire sur votre vie sociale.
        Ils portent sur vos activités, vos relations avec les autres et le soutien dont vous bénéficiez.
      actions:
        - action: show_text
          text: |-
            Votre vie sociale
            Tous les 6 mois

    - id: formats_and_reminders
      narration: >
        Vous recevrez un rappel par courriel et par SMS lorsqu'il sera temps de remplir vos questionnaires.
        Vous pourrez y répondre en ligne, depuis un ordinateur ou un smartphone.
      actions:
        - action: show_text
          text: |-
            Sur ordinateur
            ou smartphone

        - action: hide_illustration
          id: hand

        - action: hide_illustration
          id: laptop

        - action: show_illustration
          id: smartphone
          file: assets/devices/questionnaire-on-smartphone.svg
          x: 0.0
          y: -2.9
          width: 4.0
          z_index: 8

    - id: paper_specificities
      narration: >
        Si vous préférez, vous pouvez aussi remplir les questionnaires sur papier, à votre domicile.
        Il vous suffira de les rapporter lors de votre prochaine visite à l'hôpital.
      actions:
        - action: show_text
          text: |-
            Ou sur papier

        - action: hide_illustration
          id: smartphone

        - action: show_illustration
          id: paper
          file: assets/devices/questionnaire-on-paper.svg
          x: -1.0
          y: -3.4
          width: 4.2
          z_index: 8
