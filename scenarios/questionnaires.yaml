title: "Les questionnaires à domicile"

scene:
  room: rooms/home.yaml

  sequences:
    - id: quality_of_life
      narration: >
        Une semaine avant votre visite l'hôpital, vous remplissez à domicile un questionnaire sur votre qualité de vie.
        Il nous permet de mieux comprendre comment vous vous sentez.
        Ce questionnaire vous sera de nouveau demandé trois mois plus tard pour suivre l'évolution de votre quotidien.
      actions:

        - action: show_illustration
          id: laptop
          file: assets/devices/questionnaire-on-laptop.svg
          x: -1.0
          y: -2.5
          width: 5.4
          z_index: 8

        - action: show_illustration
          id: hand
          file: assets/devices/mouse-in-hand.svg
          x: 2.3
          y: -3.4
          width: 1.5
          z_index: 9
          motion:
            type: ping_pong
            dx: 0.20
            dy: 0.0
            period: 4.0
            active_fraction: 0.5

    - id: social_life
      narration: >
        Une fois tous les six mois, vous remplissez aussi un questionnaire sur votre vie sociale.
        Ils concernent notamment le soutien que vous recevez, vos activités et vos échanges avec les autres.
        Vous recevrez un rappel par courriel et par SMS lorsque ce sera le moment de répondre.
      actions: []

    - id: formats_and_reminders
      narration: >
        Vous pouvez remplir ces questionnaires sur un ordinateur, sur un téléphone, ou choisir la version papier.
      actions:

        - action: hide_illustration
          id: hand

        - action: hide_illustration
          id: laptop

        - action: show_illustration
          id: smartphone
          file: assets/devices/questionnaire-on-smartphone.svg
          x: 0.0
          y: -2.9
          width: 4.0
          z_index: 8

    - id: paper_specificities
      narration: >
        Si vous choisissez le papier, rapportez vos questionnaires lors de votre prochaine visite à l'hôpital.
      actions:

        - action: hide_illustration
          id: smartphone

        - action: show_illustration
          id: paper
          file: assets/devices/questionnaire-on-paper.svg
          x: -1.0
          y: -3.4
          width: 4.2
          z_index: 8
