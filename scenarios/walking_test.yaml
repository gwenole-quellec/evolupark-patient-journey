title: "Le test de marche"

scene:
  room: rooms/movement_lab.yaml

  sequences:
    - id: introduction
      narration: >
        À chaque visite, vous réaliserez un test de marche.
      actions:
        - action: show_text
          text: "Évaluation de votre mobilité"

        - action: place_character
          character: patient
          pose: sitting
          chair: walking_course_chair
          facing: right

        - action: place_character
          character: nurse
          pose: standing_with_tablet
          facing: left
          x: 4.5
          bottom_y: -2.6

    - id: stand_up
      narration: >
        Ce test nous permet d'évaluer votre mobilité dans les gestes du quotidien.
      actions:
        - action: show_text
          text: "Aisance des mouvements"

        - action: stand_up
          character: patient
          facing: right
          to:
            x: -2.4
            bottom_y: -2.6

    - id: walk_forward
      narration: >
        Pendant ce test, nous observons votre aisance, la vitesse ainsi que la régularité de votre marche.
      actions:
        - action: show_text
          text: "Aisance vitesse et régularité"

        - action: walk_to
          character: patient
          facing: right
          to:
            x: 2.5
            bottom_y: -2.6

    - id: turn_back
      narration: >
        Le franchissement d'obstacles nous permettrons en outre de repérer d'éventuels blocages de votre marche.
      actions:
        - action: show_text
          text: "Blocages de la marche"

        - action: change_pose
          character: patient
          pose: standing
          facing: left

        - action: walk_to
          character: patient
          facing: left
          to:
            x: -2.4
            bottom_y: -2.6

    - id: sit_down
      narration: >
        Ces observations nous aideront à suivre
        l'évolution de votre mobilité au fil du temps.
      actions:
        - action: show_text
          text: "Suivi dans le temps"

        - action: sit_on
          character: patient
          chair: walking_course_chair
          pose: sitting
          facing: right

    - id: neurologist_arrives
      narration: >
        Lors de la visite d'inclusion, la neurologue évalue également votre motricité et vos fonctions cognitives.
      actions:
        - action: show_text
          text: |-
            Examens neurologiques :
            UPDRS-III et MoCA

        - action: place_character
          character: neurologist
          pose: standing
          facing: right
          x: -7.0
          bottom_y: -2.8

        - action: set_z_index
          character: neurologist
          z_index: 3

        - action: walk_to
          character: neurologist
          facing: right
          to:
            x: -0.8
            bottom_y: -2.8

        - action: change_pose
          character: neurologist
          pose: standing
          facing: left

    - id: updrs1
      narration: >
        L'UPDRS-III mesure vos capacités motrices, tandis que le MoCA évalue notamment votre mémoire et votre attention.
      actions:
        - action: show_text
          text: |-
            Visite d'inclusion :
            Évaluations par la neurologue

        - action: stand_up
          character: patient
          facing: right
          to:
            x: -2.6
            bottom_y: -2.8

    - id: updrs2
      narration: >
        Lors des visites de suivi, ces évaluations sont reprises par l'infirmier pour observer leur évolution.
      actions:
        - action: show_text
          text: |-
            Visites de suivi :
            Évaluations par l'infirmier
