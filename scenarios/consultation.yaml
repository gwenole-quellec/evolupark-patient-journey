
title: "Ma visite dans l'étude EvoluPark"

style:
  background: "#F2F2F2"
  text_color: "#191847"

voice:
  name: "fr-FR-DeniseNeural"
  rate: "-0%"

characters:
  patient:
    native_facing: right
    poses:
      walking: "assets/characters/patient/walking.svg"
      standing: "assets/characters/patient/standing.svg"
      sitting: "assets/characters/patient/sitting.svg"
    heights:
      standing: 3.5
      sitting: 2.8

  neurologist:
    native_facing: right
    poses:
      standing: "assets/characters/neurologist/standing.svg"
      walking: "assets/characters/neurologist/walking.svg"
    heights:
      standing: 3.5
      walking: 3.5

sequences:

  - id: arrival
    narration: >
      Bienvenue dans l'étude EvoluPark.
      Nous allons vous expliquer comment se déroule
      votre participation à cette recherche.

    actions:
      - character: patient
        pose: walking
        facing: right
        action: enter
        from: left
        to:
          x: -2.0
          bottom_y: -2.6

      - character: patient
        pose: standing
        facing: right
        action: stop

  - id: seating
    narration: >
      Lors de votre visite d'inclusion,
      vous rencontrez un neurologue au
      Centre Hospitalier Universitaire de Brest.

    actions:
      - character: patient
        pose: sitting
        action: change_pose

  - id: consultation
    narration: >
      Le neurologue vous présente les objectifs
      de l'étude, son déroulement et répond
      à toutes vos questions.
      Vous disposez du temps nécessaire pour
      réfléchir avant de décider de participer.

    actions:
      - character: neurologist
        pose: walking
        facing: left
        action: enter
        from: right
        to:
          x: 2.6
          bottom_y: -2.6

      - character: neurologist
        pose: standing
        facing: left
        action: stop

      - action: show_text
        text: "Le neurologue vous présente l'étude."
