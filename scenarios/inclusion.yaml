title: "La visite d'inclusion"

scene:
  room: rooms/consultation.yaml

  sequences:
    - id: arrival
      narration: >
        Après votre premier échange téléphonique avec l'attaché de recherche clinique, vous vous rendez au CHU de Brest, à la date et à l'heure convenues, pour votre visite d'inclusion.
      actions:
        - action: show_text
          text: |-
            Votre rendez-vous au CHU de Brest

        - action: show_illustration
          id: patient_mug
          x: 0.55
          y: -1.5
          width: 0.42
          z_index: 4
          facing: right
          animation:
            frames:
              - assets/furniture/coffee-mug1.svg
              - assets/furniture/coffee-mug2.svg
            period: 1.0

        - action: show_illustration
          id: neurologist_mug
          x: 3.1
          y: -1.5
          width: 0.42
          z_index: 4
          facing: left
          animation:
            frames:
              - assets/furniture/coffee-mug1.svg
              - assets/furniture/coffee-mug2.svg
            period: 1.0
            phase: 0.5

        - action: walk_to
          character: patient
          facing: right
          from: left
          location: next_to_left_seat

    - id: seating
      narration: >
        À votre arrivée, vous rencontrez une neurologue du CHU de Brest.
      actions:
        - action: show_text
          text: |-
            Rencontre avec la neurologue

        - action: place_character
          character: neurologist
          pose: standing
          facing: right
          location: door

        - action: walk_to
          character: neurologist
          facing: left
          from: right
          location: next_to_right_seat

        - action: sit_on
          character: patient
          chair: patient_chair
          pose: sitting

        - action: sit_on
          character: neurologist
          chair: neurologist_chair
          pose: sitting
          facing: left

    - id: consultation
      narration: >
        La neurologue vous explique les objectifs de l'étude, son déroulement et les examens prévus.
        Elle répond à toutes vos questions, puis vous décidez librement si vous souhaitez participer.
      actions:
        - action: show_text
          text: |-
            Présentation de l'étude
            et temps de réflexion
