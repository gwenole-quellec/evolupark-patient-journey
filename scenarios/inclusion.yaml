title: "La visite d'inclusion"

scene:
  room: rooms/consultation.yaml

  sequences:
    - id: arrival
      narration: >
        Bienvenue dans l'étude EvoluPark.
        Nous allons vous expliquer comment se déroule votre participation à cette recherche.
      actions:
        - action: enter
          character: patient
          pose: walking
          facing: right
          from: left
          to:
            x: -1.
            bottom_y: -3.1
        - action: stop
          character: patient
          pose: standing
          facing: right

    - id: seating
      narration: >
        Lors de votre visite d'inclusion, vous rencontrez une neurologue
        au Centre Hospitalier Universitaire de Brest.
      actions:
        - action: enter
          character: neurologist
          pose: walking
          facing: left
          from: right
          to:
            x: 4.9
            bottom_y: -3.1
        - action: stop
          character: neurologist
          pose: standing
          facing: left
        - action: sit_on
          character: patient
          chair: patient_chair
          pose: sitting
        - action: sit_on
          character: neurologist
          chair: neurologist_chair
          pose: sitting
          facing: left

    - id: consultation
      narration: >
        La neurologue vous présente les objectifs de l'étude,
        son déroulement et répond à toutes vos questions.
        Vous disposez du temps nécessaire pour réfléchir avant
        de décider de participer.
      actions:
        - action: show_text
          text: "La neurologue vous présente l'étude."
