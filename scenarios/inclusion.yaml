title: "Ma visite dans l'étude EvoluPark"

style:
  wall_color: "#F2F2F2"
  floor_color: "#E3E7EA"
  brand_grey: "#7D8891"
  brand_grey_light: "#B8C1C7"
  brand_teal: "#2EA8B8"
  brand_teal_light: "#8FD2DA"
  font: "Liberation Sans"

logo:
  file: "assets/logo/evolupark.svg"
  width: 1.65

voice:
  local: false
  name: fr-FR-VivienneMultilingualNeural
  rate: "-5%"

#voice:
#  local: true
#  model: fr_FR-siwis-medium
#  length_scale: 1.05
#  speaker: 0

characters:
  patient:
    native_facing: right
    poses:
      walking: "assets/characters/patient/walking.svg"
      standing: "assets/characters/patient/standing.svg"
      sitting: "assets/characters/patient/sitting.svg"
    heights:
      walking: 3.5
      standing: 3.5
      sitting: 2.8
    anchors:
      sitting:
        seat: {x: 0.44, y: 0.29}

  neurologist:
    native_facing: right
    poses:
      walking: "assets/characters/neurologist/walking.svg"
      standing: "assets/characters/neurologist/standing.svg"
      sitting: "assets/characters/neurologist/sitting.svg"
    heights:
      walking: 3.5
      standing: 3.5
      sitting: 2.8
    anchors:
      sitting:
        seat: {x: 0.44, y: 0.29}

furniture:
  chair:
    file: "assets/furniture/chair.svg"
    native_facing: right
    height: 2.1
    anchors:
      seat: {x: 0.42, y: 0.42}

  coffee_table:
    file: "assets/furniture/coffee-table.svg"
    height: 1.6

scene:
  floor_y: -2.6

  background_decor:
    file: "assets/backgrounds/inclusion.svg"
    width: 2.0
    x: -5.0
    y: -1.78
    opacity: 1.0

  furniture:
    - id: patient_chair
      type: chair
      facing: right
      x: -2.0
      bottom_y: -2.6

    - id: neurologist_chair
      type: chair
      facing: left
      x: 2.0
      bottom_y: -2.6

    - id: center_table
      type: coffee_table
      x: 0.0
      bottom_y: -2.6

sequences:
  - id: arrival
    narration: >
      Bienvenue dans l'étude EvoluPark.
      Nous allons vous expliquer comment se déroule votre participation à cette recherche.
    actions:
      - action: enter
        character: patient
        pose: walking
        facing: right
        from: left
        to:
          x: -2.1
          bottom_y: -2.6
      - action: stop
        character: patient
        pose: standing
        facing: right

  - id: seating
    narration: >
      Lors de votre visite d'inclusion, vous rencontrez un ou une neurologue au Centre Hospitalier Universitaire de Brest.
    actions:
      - action: enter
        character: neurologist
        pose: walking
        facing: left
        from: right
        to:
          x: 2.1
          bottom_y: -2.6
      - action: stop
        character: neurologist
        pose: standing
        facing: left
      - action: sit_on
        character: patient
        chair: patient_chair
        pose: sitting
      - action: sit_on
        character: neurologist
        chair: neurologist_chair
        pose: sitting
        facing: left

  - id: consultation
    narration: >
      Le ou la neurologue vous présente les objectifs de l'étude, son déroulement et répond à toutes vos questions.
      Vous disposez du temps nécessaire pour réfléchir avant de décider de participer.
    actions:
      - action: show_text
        text: "Le neurologue vous présente l'étude."
