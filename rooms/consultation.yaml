# Examination room: consultation table/chairs and ophthalmic equipment.
wall_color: "#EDF4F5"
floor_color: "#E8DED2"
floor_y: -1.5

objects:
  - id: harbor_picture
    file: assets/furniture/frame.svg
    x: 1.85
    y: 0.8
    width: 3.1
    z_index: -2

  - id: ophthalmic_device
    file: assets/devices/ophthalmic-imaging-device.svg
    x: -4.0
    bottom_y: -1.75
    height: 2.65
    z_index: -1
    facing: right

  - id: ophthalmic_stool
    type: chair
    file: assets/devices/ophthalmic-stool.svg
    x: -6.2
    bottom_y: -1.75
    height: 1.05
    z_index: -1
    anchors:
      seat: {x: 0.50, y: 0.75}

  - id: second_ophthalmic_stool
    type: chair
    file: assets/devices/ophthalmic-stool.svg
    x: -2.0
    bottom_y: -1.75
    height: 1.05
    z_index: -1
    anchors:
      seat: {x: 0.50, y: 0.75}

  - id: patient_chair
    type: chair
    file: assets/furniture/chair.svg
    x: -1.
    bottom_y: -3.1
    height: 1.85
    facing: right
    z_index: 1
    anchors:
      seat: {x: 0.42, y: 0.42}

  - id: neurologist_chair
    type: chair
    file: assets/furniture/chair.svg
    x: 4.75
    bottom_y: -3.1
    height: 1.85
    facing: left
    z_index: 1
    anchors:
      seat: {x: 0.42, y: 0.42}

  - id: examination_table
    file: assets/furniture/examination-table.svg
    x: 1.85
    bottom_y: -3.3
    width: 4.0
    z_index: 3
