# Examination room: consultation table/chairs and ophthalmic equipment.
wall_color: "#EDF4F5"
floor_color: "#E8DED2"
floor_y: -1.5

objects:
  - id: harbor_picture
    file: assets/furniture/frame.svg
    x: 1.85
    y: -0.7
    width: 3.1
    z_index: -2

  - id: ophthalmic_device
    file: assets/devices/ophthalmic-imaging-device.svg
    x: -4.0
    y: -1.75
    height: 2.65
    z_index: -1
    facing: right

  - id: ophthalmic_stool
    type: chair
    file: assets/devices/ophthalmic-stool.svg
    x: -6.2
    y: -1.75
    height: 1.05
    z_index: -1
    anchors:
      seat: {x: 0.50, y: 0.75}

  - id: second_ophthalmic_stool
    type: chair
    file: assets/devices/ophthalmic-stool.svg
    x: -2.0
    y: -1.75
    height: 1.05
    z_index: -1
    anchors:
      seat: {x: 0.50, y: 0.75}

  - id: patient_chair
    type: chair
    file: assets/furniture/chair.svg
    x: -1.
    y: -3.1
    height: 1.85
    facing: right
    z_index: 1
    anchors:
      seat: {x: 0.42, y: 0.42}

  - id: neurologist_chair
    type: chair
    file: assets/furniture/chair.svg
    x: 4.75
    y: -3.1
    height: 1.85
    facing: left
    z_index: 1
    anchors:
      seat: {x: 0.42, y: 0.42}

  - id: examination_table
    file: assets/furniture/examination-table.svg
    x: 1.85
    y: -3.3
    width: 4.0
    z_index: 3

locations:
  next_to_left_seat:
    x: -1.0
    y: -3.3

  next_to_right_seat:
    x: 4.75
    y: -3.3

  door:
    x: 8.5
    y: -3.6

  behind_left_seat:
    x: -1.0
    y: -2.7

  behind_right_seat:
    x: 4.75
    y: -2.7

  next_to_left_stool:
    x: -5.2
    y: -2.0

  next_to_right_stool:
    x: -1.0
    y: -2.0

  waypoint1:
    x: 1.0
    y: -3.5

  waypoint2:
    x: 1.0
    y: -2.1
