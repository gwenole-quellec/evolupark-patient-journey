# Movement lab: two equipment tripods and a chair for the walking route.
wall_color: "#EEF2E8"
floor_color: "#E3E7EA"
floor_y: -1.5

objects:
  - id: window
    x: 0.
    y: 0.2
    height: 2.8
    z_index: 0
    animation:
      frames:
        - assets/furniture/lab-window1.svg
        - assets/furniture/lab-window2.svg
        - assets/furniture/lab-window3.svg
        - assets/furniture/lab-window4.svg
        - assets/furniture/lab-window5.svg
      period: 6.0

  - id: left_tripod_lamp
    file: assets/devices/camera-large-tripod.svg
    x: -5.35
    y: -2.0
    height: 3.3
    z_index: 1
    facing: right

  - id: right_tripod_lamp
    file: assets/devices/camera-large-tripod.svg
    x: 5.35
    y: -2.0
    height: 3.3
    z_index: 1
    facing: left

  - id: cone1
    file: assets/furniture/cone.svg
    x: 1.0
    y: -2.4
    height: 0.7
    z_index: 1
    facing: left

  - id: cone2
    file: assets/furniture/cone.svg
    x: 0.7
    y: -2.9
    height: 0.7
    z_index: 3
    facing: left

  - id: walking_course_chair
    type: chair
    file: assets/furniture/chair.svg
    x: -3.5
    y: -2.6
    height: 1.8
    facing: right
    z_index: 1
    anchors:
      seat: {x: 0.42, y: 0.42}

locations:
  nurse_standing:
    x: 4.5
    y: -2.6

  patient_standing:
    x: -2.4
    y: -2.6

  patient_turning:
    x: 2.5
    y: -2.6

  neurologist_entering:
    x: -7.0
    y: -2.8

  neurologist_standing:
    x: -0.8
    y: -2.8

  patient_facing_neurologist:
    x: -2.6
    y: -2.8
